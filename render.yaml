services:
  # Backend API Web Service
  - type: web
    name: crm-backend
    env: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run prisma:seed
    startCommand: node src/server.js
    rootDir: backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: crm-postgres-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: '1h'
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_AGENT_EMAIL
        sync: false
      - key: SEED_AGENT_PASSWORD
        sync: false
      - key: CLIENT_URL
        value: https://crm-frontend.onrender.com

  # Frontend Static Site
  - type: web
    name: crm-frontend
    env: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    rootDir: frontend
    envVars:
      - key: VITE_API_URL
        value: https://crm-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # Hosted PostgreSQL on Render
  - name: crm-postgres-db
    databaseName: crm_db
    user: crm_user
    plan: free
